<footer class="border-t border-slate-200 bg-white">
  <div class="mx-auto max-w-[1280px] px-4 py-6 md:px-6">

    <!-- Grid principal -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-3">

      <!-- Contacto -->
      <div>
        <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-700">Contáctanos</h3>
        <ul class="space-y-1.5 text-sm text-slate-500">
          <li class="flex items-start gap-2">
            <lucide-icon [name]="icons.mapPin" class="mt-0.5 h-3.5 w-3.5 shrink-0 text-slate-400"></lucide-icon>
            <span>Cl.9 # 41a - 16, Bogotá, Colombia</span>
          </li>
          <li class="flex items-center gap-2">
            <lucide-icon [name]="icons.phone" class="h-3.5 w-3.5 shrink-0 text-slate-400"></lucide-icon>
            <a href="tel:+573001234567" class="transition-colors hover:text-slate-700">+57 312 4578522</a>
          </li>
          <li class="flex items-center gap-2">
            <lucide-icon [name]="icons.mail" class="h-3.5 w-3.5 shrink-0 text-slate-400"></lucide-icon>
            <a href="mailto:contacto&#64;solucionesapps.co" class="transition-colors hover:text-slate-700">contacto&#64;dislana.co</a>
          </li>
        </ul>
      </div>

      <!-- PQR -->
      <div>
        <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-700">PQR</h3>
        <p class="mb-3 text-sm text-slate-500">
          ¿Tienes una pregunta, queja o reclamo? Escríbenos y te responderemos a la brevedad.
        </p>
        <a
          routerLink="/pqr"
          class="inline-flex items-center gap-1.5 rounded-md bg-slate-800 px-3 py-1.5 text-xs font-medium text-white transition hover:bg-slate-700"
        >
          <lucide-icon [name]="icons.messageSquare" class="h-3.5 w-3.5"></lucide-icon>
          Enviar PQR
        </a>
      </div>

      <!-- Legal -->
      <div>
        <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-700">Legal</h3>
        <ul class="space-y-1.5 text-sm text-slate-500">
          <li>
            <a routerLink="/terminos-condiciones" class="transition-colors hover:text-slate-700">Términos y condiciones</a>
          </li>
          <li>
            <a routerLink="/tratamiento-datos" class="transition-colors hover:text-slate-700">Tratamiento de datos</a>
          </li>
        </ul>
      </div>

    </div>

    <!-- Separador + copyright -->
    <div class="mt-5 border-t border-slate-100 pt-4 text-center text-sm text-slate-500">
      Desarrollado por <span class="font-semibold text-slate-800">SolucionesApps</span>
    </div>

  </div>
</footer>
