<div class="mx-auto w-full max-w-[680px] px-4 py-6 md:px-6 md:py-10">

  <div class="mb-6 flex flex-col gap-1">
    <h1 class="text-[clamp(1.7rem,4vw,1.7rem)] font-semibold tracking-[-0.04em] text-[#0f1a2c]">
      PQR
    </h1>
    <p class="text-sm text-slate-500">
      Preguntas, Quejas y Reclamos — te responderemos a la brevedad.
    </p>
  </div>

  @if (!submitted) {
    <section class="overflow-hidden border border-slate-200 bg-white shadow-[0_24px_60px_rgba(15,23,42,0.06)]">
      <div class="border-b border-slate-200 bg-slate-50 px-5 py-3 md:px-6">
        <h2 class="text-[1.02rem] font-semibold tracking-[0.02em] text-[#0f1a2c]">Nueva solicitud</h2>
      </div>

      <form (ngSubmit)="onSubmit()" #pqrForm="ngForm" class="flex flex-col gap-5 p-5 md:p-6">

        <!-- Tipo -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[0.7rem] font-semibold uppercase tracking-[0.12em] text-slate-500">
            Tipo de solicitud
          </label>
          <div class="flex flex-wrap gap-2">
            @for (t of pqrTypes; track t) {
              <button
                type="button"
                (click)="type = t"
                [class]="type === t
                  ? 'rounded-full bg-[#141b2d] px-4 py-1.5 text-sm font-semibold text-white'
                  : 'rounded-full border border-slate-200 bg-white px-4 py-1.5 text-sm text-slate-600 transition hover:border-slate-300 hover:bg-slate-50'"
              >
                {{ t }}
              </button>
            }
          </div>
        </div>

        <!-- Asunto -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[0.7rem] font-semibold uppercase tracking-[0.12em] text-slate-500">
            Asunto
          </label>
          <input
            type="text"
            name="subject"
            [(ngModel)]="subject"
            required
            maxlength="150"
            placeholder="Escribe el asunto de tu solicitud"
            class="h-10 w-full rounded border border-slate-200 bg-white px-3 text-sm text-slate-700 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none"
          />
        </div>

        <!-- Mensaje -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[0.7rem] font-semibold uppercase tracking-[0.12em] text-slate-500">
            Mensaje
          </label>
          <textarea
            name="message"
            [(ngModel)]="message"
            required
            maxlength="2000"
            rows="6"
            placeholder="Describe tu solicitud con el mayor detalle posible"
            class="w-full resize-none rounded border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 focus:border-slate-400 focus:outline-none"
          ></textarea>
          <span class="self-end text-[0.7rem] text-slate-400">{{ message.length }} / 2000</span>
        </div>

        <!-- Submit -->
        <div class="flex justify-end">
          <button
            type="submit"
            [disabled]="loading || !subject.trim() || !message.trim()"
            class="inline-flex h-10 items-center gap-2 bg-[#141b2d] px-6 text-sm font-semibold text-white transition hover:bg-black disabled:cursor-not-allowed disabled:opacity-50"
          >
            @if (loading) {
              <span class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
              Enviando...
            } @else {
              <lucide-icon [name]="icons.send" class="h-4 w-4"></lucide-icon>
              Enviar solicitud
            }
          </button>
        </div>

      </form>
    </section>
  } @else {
    <section class="flex flex-col items-center gap-4 overflow-hidden border border-slate-200 bg-white px-6 py-14 text-center shadow-[0_24px_60px_rgba(15,23,42,0.06)]">
      <lucide-icon [name]="icons.check" class="h-12 w-12 text-green-500"></lucide-icon>
      <h2 class="text-xl font-semibold text-[#0f1a2c]">¡Solicitud enviada!</h2>
      <p class="max-w-sm text-sm text-slate-500">
        Hemos recibido tu {{ type.toLowerCase() }}. Nos comunicaremos contigo a la brevedad posible.
      </p>
      <button
        type="button"
        (click)="onNew()"
        class="mt-2 inline-flex h-10 items-center bg-[#141b2d] px-6 text-sm font-semibold text-white transition hover:bg-black"
      >
        Nueva solicitud
      </button>
    </section>
  }

</div>
